<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 178" width="1064" height="178" role="img" aria-labelledby="dcb-agg-title dcb-agg-desc">
  <title id="dcb-agg-title">Traditional aggregate model: StudentSubscribedToCourse belongs to neither aggregate</title>
  <desc id="dcb-agg-desc">The Course aggregate holds CourseCreated, CourseRenamed and CourseCapacityChanged; the Student aggregate holds StudentCreated. StudentSubscribedToCourse sits between them, tagged with both course and student, and it is unclear which aggregate owns it.</desc>
  <style>
    .bg { fill: #ffffff; }
    .text { fill: #1f2937; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .muted { fill: #6b7280; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .guide { stroke: #e5e7eb; }
    .course { fill: #dbeafe; stroke: #60a5fa; }
    .student { fill: #dcfce7; stroke: #4ade80; }
    .shared { fill: #fef3c7; stroke: #f59e0b; }
    .agg-course { fill: #eff6ff; stroke: #3b82f6; }
    .agg-student { fill: #f0fdf4; stroke: #22c55e; }
    .agg-course-t { fill: #1d4ed8; }
    .agg-student-t { fill: #15803d; }
    .ask { stroke: #9ca3af; fill: none; }
    .ask-t { fill: #6b7280; }
    .b1 { fill: #d97706; } .b1-cell { fill: #fef3c7; stroke: #d97706; }
    .b2 { fill: #2563eb; } .b2-cell { fill: #dbeafe; stroke: #2563eb; }
    .b3 { fill: #9333ea; } .b3-cell { fill: #f3e8ff; stroke: #9333ea; }
    .off { fill: #d1d5db; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .text { fill: #e6edf3; }
      .muted, .ask-t { fill: #9ca3af; }
      .guide { stroke: #30363d; }
      .course { fill: #1e3a5f; stroke: #3b82f6; }
      .student { fill: #14532d; stroke: #22c55e; }
      .shared { fill: #4a3410; stroke: #f59e0b; }
      .agg-course { fill: #0f1d33; stroke: #3b82f6; }
      .agg-student { fill: #0d2618; stroke: #22c55e; }
      .agg-course-t { fill: #93c5fd; }
      .agg-student-t { fill: #86efac; }
      .ask { stroke: #6b7280; }
      .b1 { fill: #fbbf24; } .b1-cell { fill: #3d2a06; stroke: #f59e0b; }
      .b2 { fill: #60a5fa; } .b2-cell { fill: #172a4a; stroke: #3b82f6; }
      .b3 { fill: #c084fc; } .b3-cell { fill: #2e1a47; stroke: #a855f7; }
      .off { fill: #484f58; }
    }
  </style>
  <rect class="bg" width="1064" height="178" rx="12"/>
  <rect class="agg-course" x="36" y="16" width="516" height="114" rx="10" stroke-width="2"/>
  <text class="text agg-course-t" x="52" y="40" font-size="13" font-weight="700">Course aggregate</text>
  <rect class="course" x="48" y="62" width="156" height="54" rx="8" stroke-width="1.5"/>
  <text class="text" x="126.0" y="85" text-anchor="middle" font-size="11.5" font-weight="600">CourseCreated</text>
  <text class="text muted mono" x="126.0" y="103" text-anchor="middle" font-size="10">course/c1</text>
  <rect class="course" x="216" y="62" width="156" height="54" rx="8" stroke-width="1.5"/>
  <text class="text" x="294.0" y="85" text-anchor="middle" font-size="11.5" font-weight="600">CourseRenamed</text>
  <text class="text muted mono" x="294.0" y="103" text-anchor="middle" font-size="10">course/c1</text>
  <rect class="course" x="384" y="62" width="156" height="54" rx="8" stroke-width="1.5"/>
  <text class="text" x="462.0" y="85" text-anchor="middle" font-size="11.5" font-weight="600">CourseCapacityChanged</text>
  <text class="text muted mono" x="462.0" y="103" text-anchor="middle" font-size="10">course/c1</text>
  <rect class="agg-student" x="848" y="16" width="180" height="114" rx="10" stroke-width="2"/>
  <text class="text agg-student-t" x="864" y="40" font-size="13" font-weight="700">Student aggregate</text>
  <rect class="student" x="860" y="62" width="156" height="54" rx="8" stroke-width="1.5"/>
  <text class="text" x="938.0" y="85" text-anchor="middle" font-size="11.5" font-weight="600">StudentCreated</text>
  <text class="text muted mono" x="938.0" y="103" text-anchor="middle" font-size="10">student/s1</text>
  <rect class="shared" x="612.0" y="62" width="176" height="54" rx="8" stroke-width="1.5"/>
  <text class="text" x="700.0" y="85" text-anchor="middle" font-size="11.5" font-weight="600">StudentSubscribedToCourse</text>
  <text class="text muted mono" x="700.0" y="103" text-anchor="middle" font-size="10">course/c1 student/s1</text>
  <path class="ask" d="M 608.0 89 L 558 89" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path class="ask" d="M 566 83 L 558 89 L 566 95" stroke-width="1.5"/>
  <text class="ask-t" x="584.0" y="81" text-anchor="middle" font-size="16" font-weight="700" font-family="sans-serif">?</text>
  <path class="ask" d="M 788.0 89 L 842 89" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path class="ask" d="M 834 83 L 842 89 L 834 95" stroke-width="1.5"/>
  <text class="ask-t" x="816.0" y="81" text-anchor="middle" font-size="16" font-weight="700" font-family="sans-serif">?</text>
  <text class="text muted" x="532.0" y="160" text-anchor="middle" font-size="12">The subscription rules depend on both: the course capacity and the student's subscription limit. Neither aggregate can check them alone.</text>
</svg>
