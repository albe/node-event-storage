<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 288" width="860" height="288" role="img" aria-labelledby="dcb-agg-title dcb-agg-desc">
  <title id="dcb-agg-title">Classic aggregates: vertical boundaries, and StudentSubscribedToCourse fits neither</title>
  <desc id="dcb-agg-desc">The Course aggregate encloses CourseCreated and CourseCapacityChanged, the Student aggregate encloses StudentCreated. StudentSubscribedToCourse carries a course and a student tag and sits between the two aggregates, owned by neither.</desc>
  <style>
    .bg { fill: #ffffff; }
    .text { fill: #1f2937; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .muted { fill: #6b7280; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .course { fill: #dbeafe; stroke: #60a5fa; }
    .student { fill: #dcfce7; stroke: #4ade80; }
    .shared { fill: #fef3c7; stroke: #f59e0b; }
    .agg-course { fill: #eff6ff; stroke: #3b82f6; }
    .agg-student { fill: #f0fdf4; stroke: #22c55e; }
    .agg-course-t { fill: #1d4ed8; }
    .agg-student-t { fill: #15803d; }
    .ghost { fill: none; stroke: #d1d5db; }
    .ghost-t { fill: #9ca3af; }
    .ask { stroke: #9ca3af; fill: none; }
    .ask-t { fill: #6b7280; }
    .dcb { fill: #9333ea; fill-opacity: 0.08; stroke: #9333ea; }
    .dcb-t { fill: #7e22ce; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .text { fill: #e6edf3; }
      .muted, .ask-t { fill: #9ca3af; }
      .course { fill: #1e3a5f; stroke: #3b82f6; }
      .student { fill: #14532d; stroke: #22c55e; }
      .shared { fill: #4a3410; stroke: #f59e0b; }
      .agg-course { fill: #0f1d33; stroke: #3b82f6; }
      .agg-student { fill: #0d2618; stroke: #22c55e; }
      .agg-course-t { fill: #93c5fd; }
      .agg-student-t { fill: #86efac; }
      .ghost { stroke: #30363d; }
      .ghost-t { fill: #6e7681; }
      .ask { stroke: #6b7280; }
      .dcb { fill: #a855f7; fill-opacity: 0.14; stroke: #c084fc; }
      .dcb-t { fill: #d8b4fe; }
    }
  </style>
  <rect class="bg" width="860" height="288" rx="12"/>
  <rect class="agg-course" x="34.0" y="16" width="232" height="224" rx="12" stroke-width="2"/>
  <rect class="agg-student" x="594.0" y="16" width="232" height="224" rx="12" stroke-width="2"/>
  <text class="text agg-course-t" x="150" y="44" text-anchor="middle" font-size="13" font-weight="700">Course aggregate</text>
  <text class="text agg-student-t" x="710" y="44" text-anchor="middle" font-size="13" font-weight="700">Student aggregate</text>
  <rect class="course" x="50.0" y="64" width="200" height="54" rx="8" stroke-width="1.5"/>
  <text class="text" x="150" y="87" text-anchor="middle" font-size="12.5" font-weight="600">CourseCreated</text>
  <text class="text muted mono" x="150" y="105" text-anchor="middle" font-size="10.5">course/c1</text>
  <rect class="course" x="50.0" y="170" width="200" height="54" rx="8" stroke-width="1.5"/>
  <text class="text" x="150" y="193" text-anchor="middle" font-size="12.5" font-weight="600">CourseCapacityChanged</text>
  <text class="text muted mono" x="150" y="211" text-anchor="middle" font-size="10.5">course/c1</text>
  <rect class="student" x="610.0" y="64" width="200" height="54" rx="8" stroke-width="1.5"/>
  <text class="text" x="710" y="87" text-anchor="middle" font-size="12.5" font-weight="600">StudentCreated</text>
  <text class="text muted mono" x="710" y="105" text-anchor="middle" font-size="10.5">student/s1</text>
  <rect class="shared" x="325.0" y="170" width="210" height="54" rx="8" stroke-width="1.5"/>
  <text class="text" x="430" y="193" text-anchor="middle" font-size="12.5" font-weight="600">StudentSubscribedToCourse</text>
  <text class="text muted mono" x="430" y="211" text-anchor="middle" font-size="10.5">course/c1 student/s1</text>
  <path class="ask" d="M 321 197.0 L 272.0 197.0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path class="ask" d="M 280.0 191.0 L 272.0 197.0 L 280.0 203.0" stroke-width="1.5"/>
  <text class="ask-t" x="295.5" y="187.0" text-anchor="middle" font-size="16" font-weight="700" font-family="sans-serif">?</text>
  <path class="ask" d="M 539 197.0 L 588.0 197.0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path class="ask" d="M 580.0 191.0 L 588.0 197.0 L 580.0 203.0" stroke-width="1.5"/>
  <text class="ask-t" x="564.5" y="187.0" text-anchor="middle" font-size="16" font-weight="700" font-family="sans-serif">?</text>
  <text class="text muted" x="430.0" y="270" text-anchor="middle" font-size="12">Classic: one boundary per aggregate, running vertically. The subscription belongs to both and fits neither.</text>
</svg>
