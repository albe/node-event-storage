<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 414" width="920" height="414" role="img" aria-labelledby="dcb-cond-title dcb-cond-desc">
  <title id="dcb-cond-title">A commit condition can be a subset of the decision model</title>
  <desc id="dcb-cond-desc">The decision model reads CourseDefined, CourseCapacityChanged, StudentSubscribedToCourse and StudentUnsubscribedFromCourse. The commit condition, narrowed with without(StudentUnsubscribedFromCourse), checks only the first three. A concurrent unsubscription lets the commit succeed, a concurrent subscription causes an OptimisticConcurrencyError.</desc>
  <style>
    .bg { fill: #ffffff; }
    .text { fill: #1f2937; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .muted { fill: #6b7280; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .course { fill: #dbeafe; stroke: #60a5fa; }
    .shared { fill: #fef3c7; stroke: #f59e0b; }
    .dcb { fill: #9333ea; fill-opacity: 0.08; stroke: #9333ea; }
    .dcb-t { fill: #7e22ce; }
    .cond { fill: #0d9488; fill-opacity: 0.08; stroke: #0d9488; }
    .cond-t { fill: #0f766e; }
    .arrow { stroke: #9ca3af; fill: none; }
    .ok { fill: #dcfce7; stroke: #16a34a; } .ok-t { fill: #15803d; }
    .err { fill: #fee2e2; stroke: #dc2626; } .err-t { fill: #b91c1c; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .text { fill: #e6edf3; }
      .muted { fill: #9ca3af; }
      .course { fill: #1e3a5f; stroke: #3b82f6; }
      .shared { fill: #4a3410; stroke: #f59e0b; }
      .dcb { fill: #a855f7; fill-opacity: 0.14; stroke: #c084fc; }
      .dcb-t { fill: #d8b4fe; }
      .cond { fill: #14b8a6; fill-opacity: 0.12; stroke: #2dd4bf; }
      .cond-t { fill: #5eead4; }
      .arrow { stroke: #6b7280; }
      .ok { fill: #0f2e1a; stroke: #22c55e; } .ok-t { fill: #86efac; }
      .err { fill: #3b1114; stroke: #f87171; } .err-t { fill: #fca5a5; }
    }
  </style>
  <rect class="bg" width="920" height="414" rx="12"/>
  <rect class="dcb" x="20" y="16" width="284" height="354" rx="16" stroke-width="2.5"/>
  <text class="text dcb-t" x="38" y="42" font-size="13" font-weight="700">Decision model reads</text>
  <rect class="cond" x="32" y="58" width="260" height="224" rx="12" stroke-width="2" stroke-dasharray="7 4"/>
  <text class="text cond-t" x="44" y="78" font-size="12" font-weight="700">Commit condition checks</text>
  <rect class="course" x="44" y="88" width="236" height="54" rx="8" stroke-width="1.5"/>
  <text class="text" x="162.0" y="111" text-anchor="middle" font-size="12.5" font-weight="600">CourseDefined</text>
  <text class="text muted mono" x="162.0" y="129" text-anchor="middle" font-size="10.5">course/c1</text>
  <rect class="course" x="44" y="152" width="236" height="54" rx="8" stroke-width="1.5"/>
  <text class="text" x="162.0" y="175" text-anchor="middle" font-size="12.5" font-weight="600">CourseCapacityChanged</text>
  <text class="text muted mono" x="162.0" y="193" text-anchor="middle" font-size="10.5">course/c1</text>
  <rect class="shared" x="44" y="216" width="236" height="54" rx="8" stroke-width="1.5"/>
  <text class="text" x="162.0" y="239" text-anchor="middle" font-size="12.5" font-weight="600">StudentSubscribedToCourse</text>
  <text class="text muted mono" x="162.0" y="257" text-anchor="middle" font-size="10.5">course/c1 student/s1</text>
  <rect class="shared" x="44" y="300" width="236" height="54" rx="8" stroke-width="1.5"/>
  <text class="text" x="162.0" y="323" text-anchor="middle" font-size="12.5" font-weight="600">StudentUnsubscribedFromCourse</text>
  <text class="text muted mono" x="162.0" y="341" text-anchor="middle" font-size="10.5">course/c1 student/s2</text>
  <text class="text cond-t mono" x="24" y="394" font-size="11">model.commitCondition.without('StudentUnsubscribedFromCourse')</text>
  <text class="text muted" x="380" y="42" font-size="12" font-weight="600" letter-spacing="0.4">NEW EVENTS SINCE THE MODEL WAS READ</text>
  <rect class="shared" x="380" y="300" width="236" height="54" rx="8" stroke-width="1.5"/>
  <text class="text" x="498.0" y="323" text-anchor="middle" font-size="12.5" font-weight="600">StudentUnsubscribedFromCourse</text>
  <text class="text muted mono" x="498.0" y="341" text-anchor="middle" font-size="10.5">course/c1 student/s2</text>
  <path class="arrow" d="M 624 327.0 L 660 327.0 M 652 321.0 L 660 327.0 L 652 333.0" stroke-width="1.5"/>
  <rect class="ok" x="668" y="300" width="232" height="54" rx="8" stroke-width="1.5"/>
  <text class="text ok-t" x="784.0" y="323" text-anchor="middle" font-size="12.5" font-weight="700">Commit succeeds</text>
  <text class="text muted" x="784.0" y="341" text-anchor="middle" font-size="10.5">outside the commit condition</text>
  <rect class="shared" x="380" y="216" width="236" height="54" rx="8" stroke-width="1.5"/>
  <text class="text" x="498.0" y="239" text-anchor="middle" font-size="12.5" font-weight="600">StudentSubscribedToCourse</text>
  <text class="text muted mono" x="498.0" y="257" text-anchor="middle" font-size="10.5">course/c1 student/s3</text>
  <path class="arrow" d="M 624 243.0 L 660 243.0 M 652 237.0 L 660 243.0 L 652 249.0" stroke-width="1.5"/>
  <rect class="err" x="668" y="216" width="232" height="54" rx="8" stroke-width="1.5"/>
  <text class="text err-t" x="784.0" y="239" text-anchor="middle" font-size="12.5" font-weight="700">OptimisticConcurrencyError</text>
  <text class="text muted" x="784.0" y="257" text-anchor="middle" font-size="10.5">inside the commit condition</text>
  <text class="text muted" x="380" y="108" font-size="12">The model reads all four event types to count</text>
  <text class="text muted" x="380" y="126" font-size="12">free seats. Only a new subscription can make</text>
  <text class="text muted" x="380" y="144" font-size="12">the decision wrong, so only the first three</text>
  <text class="text muted" x="380" y="162" font-size="12">types guard the commit.</text>
</svg>
